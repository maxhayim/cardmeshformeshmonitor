name: Release

on:
  push:
    tags:
      - "v*"

# NOTE: This produces a native x86_64 build artifact for release-process
# validation only. It does not yet cross-compile for CardputerZero (arm64)
# or produce a cardmesh_<version>_arm64.deb — that requires the CardputerZero
# AppBuilder toolchain, which is not wired up in this repository yet.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libsqlite3-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Package build artifact
        run: |
          mkdir -p dist
          tar -czf dist/cardmesh_${{ github.ref_name }}_x86_64.tar.gz -C build cardmesh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
